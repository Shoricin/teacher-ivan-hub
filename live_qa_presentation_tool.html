<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Q&A Classroom Tool - Teacher Ivan HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-primario: #0A468C; 
            --naranja-vibrante: #F56E1E; 
            --azul-claro: #96C8E6; 
            --gris-bg: #e2e8f0; 
            --blanco-puro: #FFFFFF;
            --verde-exito: #4CAF50;
            --font-titulares: 'Montserrat', sans-serif; 
            --font-cuerpo: 'Open Sans', sans-serif; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; font-family: var(--font-cuerpo);
            background-color: var(--azul-primario); color: var(--blanco-puro);
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: rgba(0,0,0,0.2);
            border-bottom: 3px solid var(--naranja-vibrante);
        }
        .brand { font-family: var(--font-titulares); font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
        .progress { font-family: var(--font-titulares); font-size: 1.2rem; }

        /* Main Presenter Area */
        .presentation-area {
            flex: 1; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
            padding: 40px; position: relative;
        }

        .category-badge {
            background: var(--naranja-vibrante); color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 30px; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .question-text {
            font-family: var(--font-titulares); font-size: 3.5rem; line-height: 1.3;
            max-width: 1000px; margin-bottom: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Timer */
        .timer-container { margin-bottom: 40px; }
        .timer-circle {
            width: 100px; height: 100px; border-radius: 50%;
            border: 5px solid var(--azul-claro); display: flex;
            justify-content: center; align-items: center;
            font-size: 2.5rem; font-family: var(--font-titulares); font-weight: bold;
            margin: 0 auto 15px auto; transition: 0.3s;
        }
        .timer-circle.warning { border-color: var(--naranja-vibrante); color: var(--naranja-vibrante); }
        .timer-circle.danger { border-color: #D32F2F; color: #D32F2F; animation: pulse 1s infinite; }
        .btn-timer {
            background: transparent; border: 2px solid white; color: white;
            padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        .btn-timer:hover { background: white; color: var(--azul-primario); }

        /* Answers Box */
        .answers-box {
            background: white; color: var(--azul-primario);
            padding: 30px; border-radius: 12px; width: 100%; max-width: 900px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); display: none;
            animation: slideUp 0.5s ease-out; text-align: left;
        }
        .answers-box h3 {
            margin-top: 0; color: var(--naranja-vibrante); font-family: var(--font-titulares);
            border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;
        }
        .answer-list { list-style: none; padding: 0; margin: 0; }
        .answer-list li {
            font-size: 1.3rem; margin-bottom: 15px; padding-left: 35px;
            position: relative; font-weight: 600;
        }
        .answer-list li::before {
            content: "✔️"; position: absolute; left: 0; top: 2px;
            color: var(--verde-exito); font-size: 1.2rem;
        }

        /* Controls */
        .controls {
            width: 100%; background: rgba(0,0,0,0.3); padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-nav {
            background: var(--blanco-puro); color: var(--azul-primario);
            border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.2rem;
            font-family: var(--font-titulares); font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .btn-nav:hover:not(:disabled) { background: var(--azul-claro); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-reveal {
            background: var(--naranja-vibrante); color: white;
            border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.3rem;
            font-family: var(--font-titulares); font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(245, 110, 30, 0.4);
        }
        .btn-reveal:hover { background: #e05e15; transform: scale(1.05); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fade { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">TEACHER IVAN HUB | LIVE Q&A</div>
        <div class="progress">Question <span id="qIndexDisplay">1</span> / 30</div>
    </div>

    <div class="presentation-area fade" id="presentationArea">
        
        <div class="category-badge" id="categoryBadge">Category</div>
        
        <div class="question-text" id="questionText">
            "Loading question..."
        </div>

        <div class="timer-container">
            <div class="timer-circle" id="timerDisplay">30</div>
            <button class="btn-timer" onclick="startTimer()">▶ Start 30s Timer</button>
        </div>

        <div class="answers-box" id="answersBox">
            <h3>Sample Valid Responses:</h3>
            <ul class="answer-list" id="answerList">
                <!-- Answers injected here -->
            </ul>
        </div>

    </div>

    <div class="controls">
        <button class="btn-nav" id="prevBtn" onclick="prevQuestion()" disabled>⬅ Previous</button>
        <button class="btn-reveal" id="revealBtn" onclick="revealAnswers()">👁 Reveal Answers</button>
        <button class="btn-nav" id="nextBtn" onclick="nextQuestion()">Next ➡</button>
    </div>

    <script>
        const qaData = [{"category": "Airport & Immigration", "q": "Can I see your passport and boarding pass, please?", "a": ["Sure, here are my documents.", "Of course, here is my passport and ticket.", "Yes, here you go."]}, {"category": "Airport & Immigration", "q": "Are you checking any bags today?", "a": ["Yes, just this one large suitcase.", "No, I only have this carry-on bag.", "I have two bags to check in."]}, {"category": "Airport & Immigration", "q": "What is the purpose of your visit to China?", "a": ["I am here for business meetings.", "I am attending a trade fair.", "I'm visiting some manufacturing suppliers."]}, {"category": "Airport & Immigration", "q": "How long do you intend to stay in the country?", "a": ["I will be here for about two weeks.", "Just ten days for a business trip.", "My return flight is in 15 days."]}, {"category": "Airport & Immigration", "q": "Do you have anything to declare at Customs?", "a": ["No, I have nothing to declare.", "Just personal items, nothing to declare.", "No, strictly personal belongings."]}, {"category": "Transport & Directions", "q": "Where would you like to go?", "a": ["Please take me to the Marriott Hotel.", "I need to go to this address, please.", "Can you drive me to the international airport?"]}, {"category": "Transport & Directions", "q": "It's rush hour. Is it okay if we take the highway?", "a": ["That's fine, whatever is fastest.", "Yes, please take the quickest route.", "As long as we avoid the traffic, that's okay."]}, {"category": "Transport & Directions", "q": "Excuse me, are you lost? Do you need help finding something?", "a": ["Yes, could you tell me where the nearest subway station is?", "I am trying to find this address, can you point the way?", "Actually yes, I'm looking for the Canton Fair."]}, {"category": "Transport & Directions", "q": "The subway is three blocks away. Do you know how to get there?", "a": ["Three blocks straight ahead? Got it.", "Thank you, is it on the left or the right?", "I appreciate your help, I'll use my GPS from here."]}, {"category": "Transport & Directions", "q": "That will be 50 RMB for the taxi ride.", "a": ["Here is 50, keep the change.", "Do you accept WeChat Pay or just cash?", "Here you go. Can I get a receipt, please?"]}, {"category": "Hotel & Accommodation", "q": "Good evening. Do you have a reservation?", "a": ["Yes, I have a table booked under the name Morales.", "I booked a single room for three nights.", "Yes, here is my booking confirmation."]}, {"category": "Hotel & Accommodation", "q": "Could I have your passport for registration, please?", "a": ["Here is my passport.", "Sure, take a look.", "Of course, here you go."]}, {"category": "Hotel & Accommodation", "q": "Would you like a wake-up call tomorrow morning?", "a": ["Yes, please call me at 6:30 AM.", "No thank you, I have set my own alarm.", "That would be great, at 7:00 AM please."]}, {"category": "Hotel & Accommodation", "q": "Here is your keycard. Do you need help with your luggage?", "a": ["No thanks, I can manage it myself.", "Yes, could someone help me take this up to my room?", "I'm fine, thank you."]}, {"category": "Hotel & Accommodation", "q": "What time will you be checking out tomorrow?", "a": ["I will check out around 9:00 AM.", "Probably before noon.", "I'll be leaving very early, around 5:00 AM."]}, {"category": "Business & Negotiation", "q": "Welcome to our factory! How was your flight from Bolivia?", "a": ["It was long, but I'm glad to finally be here.", "It went smoothly, though it took many hours.", "A bit tiring, but I rested well on the plane."]}, {"category": "Business & Negotiation", "q": "Are you looking to buy standard motorcycle parts or custom designs?", "a": ["We mostly need standard aftermarket parts.", "Our focus is on your standard catalog items.", "Standard parts for now, perhaps custom ones later."]}, {"category": "Business & Negotiation", "q": "Our Minimum Order Quantity (MOQ) is 1,000 units. Is that acceptable?", "a": ["Yes, 1,000 units fits our quarterly forecast.", "That volume is perfectly acceptable for us.", "We can meet that minimum order quantity."]}, {"category": "Business & Negotiation", "q": "How do you usually handle the shipping logistics?", "a": ["We prefer FOB Guangzhou terms.", "Our freight forwarder handles it under FOB terms.", "Normally, we work with FOB shipping."]}, {"category": "Business & Negotiation", "q": "Our payment terms are 30% advance via T/T. Does that work for you?", "a": ["Yes, a 30% deposit is our standard procedure.", "We agree to the 30% upfront payment.", "That works perfectly. We'll wire the deposit."]}, {"category": "Eating Out", "q": "Can I start you off with something to drink?", "a": ["I'll just have some sparkling water, please.", "Could we get a bottle of red wine?", "Just some tap water with ice for now."]}, {"category": "Eating Out", "q": "Are you ready to order, or do you need a few more minutes?", "a": ["We are ready to order now, thank you.", "I think we need a couple more minutes.", "Could you give us a little more time, please?"]}, {"category": "Eating Out", "q": "Does anyone at the table have any food allergies?", "a": ["Yes, I am highly allergic to peanuts.", "No allergies for me, thank you.", "I'm lactose intolerant, so no dairy please."]}, {"category": "Eating Out", "q": "How is everything tasting so far?", "a": ["Everything is delicious, thank you.", "It's excellent, compliments to the chef.", "Very good, everything is cooked perfectly."]}, {"category": "Eating Out", "q": "Will you be paying with cash or by card?", "a": ["I'll be paying with a credit card.", "Can I pay in cash?", "I'll use my card, here you go."]}, {"category": "Small Talk & Networking", "q": "So, how long have you been in the motorcycle parts business?", "a": ["Our company has been operating for over 10 years.", "I started working in this industry about 5 years ago.", "We've been distributing parts for a long time."]}, {"category": "Small Talk & Networking", "q": "I've never been to Bolivia. What is the capital city?", "a": ["Sucre is the constitutional capital, while La Paz is the seat of government.", "The official capital is Sucre.", "Bolivia is unique because it has Sucre and La Paz as major hubs."]}, {"category": "Small Talk & Networking", "q": "Have you tried any traditional Chinese food yet?", "a": ["Yes, I had some amazing dim sum yesterday.", "Not yet, but I am excited to try some local specialties.", "I've tried a few dishes and they are delicious."]}, {"category": "Small Talk & Networking", "q": "What do you usually do in your free time?", "a": ["I enjoy developing educational tools and apps.", "I like to work on web design and coding.", "I spend my free time staying active and healthy."]}, {"category": "Small Talk & Networking", "q": "It was great meeting you. I hope you have a successful trip back!", "a": ["Thank you, it was a pleasure meeting you too.", "I appreciate it, let's keep in touch.", "Thanks! I look forward to working together."]}];
        let currentIndex = 0;
        let timerInterval;

        const categoryBadge = document.getElementById('categoryBadge');
        const questionText = document.getElementById('questionText');
        const answerList = document.getElementById('answerList');
        const answersBox = document.getElementById('answersBox');
        const timerDisplay = document.getElementById('timerDisplay');
        const revealBtn = document.getElementById('revealBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const qIndexDisplay = document.getElementById('qIndexDisplay');
        const presentationArea = document.getElementById('presentationArea');

        function loadQuestion() {
            // Animation
            presentationArea.classList.remove('fade');
            void presentationArea.offsetWidth;
            presentationArea.classList.add('fade');

            const current = qaData[currentIndex];
            
            qIndexDisplay.textContent = currentIndex + 1;
            categoryBadge.textContent = current.category;
            questionText.textContent = '"' + current.q + '"';

            // Reset Answers
            answerList.innerHTML = '';
            current.a.forEach(ans => {
                const li = document.createElement('li');
                li.textContent = ans;
                answerList.appendChild(li);
            });
            answersBox.style.display = 'none';
            revealBtn.style.display = 'block';

            // Reset Timer
            clearInterval(timerInterval);
            timerDisplay.textContent = '30';
            timerDisplay.className = 'timer-circle';

            // Buttons
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === qaData.length - 1;
        }

        function revealAnswers() {
            clearInterval(timerInterval);
            answersBox.style.display = 'block';
            revealBtn.style.display = 'none';
        }

        function nextQuestion() {
            if (currentIndex < qaData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            timerDisplay.className = 'timer-circle';

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 10 && timeLeft > 5) {
                    timerDisplay.className = 'timer-circle warning';
                } else if (timeLeft <= 5 && timeLeft > 0) {
                    timerDisplay.className = 'timer-circle danger';
                } else if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "0";
                    timerDisplay.className = 'timer-circle danger';
                    // Auto reveal when time is up
                    revealAnswers();
                }
            }, 1000);
        }

        // Listen for keyboard arrows to switch questions easily during class
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === ' ' || e.key === 'Enter') revealAnswers();
        });

        // Init
        loadQuestion();
    </script>
</body>
</html>
