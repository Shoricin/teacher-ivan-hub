<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Q&A Classroom Tool - Teacher Ivan HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-primario: #0A468C; 
            --naranja-vibrante: #F56E1E; 
            --azul-claro: #96C8E6; 
            --gris-bg: #e2e8f0; 
            --blanco-puro: #FFFFFF;
            --verde-exito: #4CAF50;
            --font-titulares: 'Montserrat', sans-serif; 
            --font-cuerpo: 'Open Sans', sans-serif; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; font-family: var(--font-cuerpo);
            background-color: var(--azul-primario); color: var(--blanco-puro);
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: rgba(0,0,0,0.2);
            border-bottom: 3px solid var(--naranja-vibrante);
        }
        .brand { font-family: var(--font-titulares); font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
        .progress { font-family: var(--font-titulares); font-size: 1.2rem; }

        /* Main Presenter Area */
        .presentation-area {
            flex: 1; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
            padding: 40px; position: relative;
        }

        .category-badge {
            background: var(--naranja-vibrante); color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 30px; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .question-text {
            font-family: var(--font-titulares); font-size: 3.5rem; line-height: 1.3;
            max-width: 1000px; margin-bottom: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Timer */
        .timer-container { margin-bottom: 40px; }
        .timer-circle {
            width: 100px; height: 100px; border-radius: 50%;
            border: 5px solid var(--azul-claro); display: flex;
            justify-content: center; align-items: center;
            font-size: 2.5rem; font-family: var(--font-titulares); font-weight: bold;
            margin: 0 auto 15px auto; transition: 0.3s;
        }
        .timer-circle.warning { border-color: var(--naranja-vibrante); color: var(--naranja-vibrante); }
        .timer-circle.danger { border-color: #D32F2F; color: #D32F2F; animation: pulse 1s infinite; }
        .btn-timer {
            background: transparent; border: 2px solid white; color: white;
            padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        .btn-timer:hover { background: white; color: var(--azul-primario); }

        /* Answers Box */
        .answers-box {
            background: white; color: var(--azul-primario);
            padding: 30px; border-radius: 12px; width: 100%; max-width: 900px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); display: none;
            animation: slideUp 0.5s ease-out; text-align: left;
        }
        .answers-box h3 {
            margin-top: 0; color: var(--naranja-vibrante); font-family: var(--font-titulares);
            border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;
        }
        .answer-list { list-style: none; padding: 0; margin: 0; }
        .answer-list li {
            font-size: 1.3rem; margin-bottom: 15px; padding-left: 35px;
            position: relative; font-weight: 600;
        }
        .answer-list li::before {
            content: "✔️"; position: absolute; left: 0; top: 2px;
            color: var(--verde-exito); font-size: 1.2rem;
        }

        /* Controls */
        .controls {
            width: 100%; background: rgba(0,0,0,0.3); padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-nav {
            background: var(--blanco-puro); color: var(--azul-primario);
            border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.2rem;
            font-family: var(--font-titulares); font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .btn-nav:hover:not(:disabled) { background: var(--azul-claro); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-reveal {
            background: var(--naranja-vibrante); color: white;
            border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.3rem;
            font-family: var(--font-titulares); font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(245, 110, 30, 0.4);
        }
        .btn-reveal:hover { background: #e05e15; transform: scale(1.05); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fade { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">TEACHER IVAN HUB | LIVE Q&A (SET 2)</div>
        <div class="progress">Question <span id="qIndexDisplay">1</span> / 30</div>
    </div>

    <div class="presentation-area fade" id="presentationArea">
        
        <div class="category-badge" id="categoryBadge">Category</div>
        
        <div class="question-text" id="questionText">
            "Loading question..."
        </div>

        <div class="timer-container">
            <div class="timer-circle" id="timerDisplay">30</div>
            <button class="btn-timer" onclick="startTimer()">▶ Start 30s Timer</button>
        </div>

        <div class="answers-box" id="answersBox">
            <h3>Sample Valid Responses:</h3>
            <ul class="answer-list" id="answerList">
                <!-- Answers injected here -->
            </ul>
        </div>

    </div>

    <div class="controls">
        <button class="btn-nav" id="prevBtn" onclick="prevQuestion()" disabled>⬅ Previous</button>
        <button class="btn-reveal" id="revealBtn" onclick="revealAnswers()">👁 Reveal Answers</button>
        <button class="btn-nav" id="nextBtn" onclick="nextQuestion()">Next ➡</button>
    </div>

    <script>
        const qaData = [{"category": "Airport & Immigration", "q": "Do you have a return ticket to Bolivia?", "a": ["Yes, my return flight is on the 25th.", "Here is my itinerary showing the return trip.", "Yes, I fly back at the end of the month."]}, {"category": "Airport & Immigration", "q": "Please look at the camera for the facial recognition.", "a": ["Sure, like this?", "Okay, I am looking directly at it.", "Should I take off my glasses first?"]}, {"category": "Airport & Immigration", "q": "How much cash currency are you carrying with you today?", "a": ["I have about 500 US dollars.", "Just a little cash, I mostly use my cards.", "Well under the limit, around 1,000 dollars."]}, {"category": "Airport & Immigration", "q": "Are you traveling alone or with a group?", "a": ["I am traveling alone.", "Just by myself for this business trip.", "I'm alone, representing my company."]}, {"category": "Airport & Immigration", "q": "Where will you be staying while in Guangzhou?", "a": ["I have a reservation at the Marriott Hotel.", "I'll be staying at a hotel near the Canton Fair.", "Here is the address of my hotel in the city center."]}, {"category": "Transport & Directions", "q": "Does this train go directly to the Canton Fair complex?", "a": ["No, you need to transfer at the next station.", "Yes, it goes straight to the Pazhou station.", "I am not sure, let's check the subway map."]}, {"category": "Transport & Directions", "q": "How much is a shuttle bus ticket to the city center?", "a": ["It costs about 25 RMB.", "The ticket is very cheap, just a few yuan.", "You can buy one at the counter for 30 RMB."]}, {"category": "Transport & Directions", "q": "Please fasten your seatbelt, we are about to leave.", "a": ["Okay, it's fastened.", "Thank you, I just buckled it.", "Got it, we are ready to go."]}, {"category": "Transport & Directions", "q": "Can you drop me off at the main entrance, not the side door?", "a": ["Sure, I will take you to the front lobby.", "No problem, the main entrance is right ahead.", "Yes, I can pull up right to the main doors."]}, {"category": "Transport & Directions", "q": "I think we are lost. Should we ask someone for directions?", "a": ["Yes, let's ask that police officer over there.", "Good idea, my GPS is not working well here.", "Let me try checking the map on my phone first."]}, {"category": "Hotel & Accommodation", "q": "Would you like a room with a city view or a quiet room at the back?", "a": ["A quiet room at the back, please. I need to rest.", "I'd love a city view if it's not too noisy.", "Whichever is available immediately, I'm quite tired."]}, {"category": "Hotel & Accommodation", "q": "Is breakfast included in my current room rate?", "a": ["Yes, a buffet breakfast is included every morning.", "No, but you can add it for an extra 50 RMB per day.", "It is included for VIP guests only."]}, {"category": "Hotel & Accommodation", "q": "The Wi-Fi isn't working in my room. Can someone help?", "a": ["I apologize, let me reset the router for your floor.", "I'll send a technician up to room 412 right away.", "Please try reconnecting using your room number as the password."]}, {"category": "Hotel & Accommodation", "q": "Can I leave my luggage here after I check out?", "a": ["Yes, we can store it in the baggage room for free.", "Of course, just give it to the bellboy by the door.", "Certainly, here is your claim tag. Keep it safe."]}, {"category": "Hotel & Accommodation", "q": "Do you offer a laundry or dry-cleaning service?", "a": ["Yes, just leave your clothes in the bag provided in the closet.", "We do. If you drop it off before 9 AM, it will be ready by evening.", "We have a dry-cleaning service for an additional charge."]}, {"category": "Business & Negotiation", "q": "Would you like to tour the production line before we sit down?", "a": ["Yes, I'd love to see how the motorcycle chains are made.", "That sounds great, lead the way.", "Actually, could we discuss the prices first?"]}, {"category": "Business & Negotiation", "q": "Can you customize the packaging with our Spanish brand logo?", "a": ["Yes, but the MOQ for custom boxes is 5,000 units.", "We can do that if you provide the high-resolution design files.", "Of course, OEM packaging is one of our specialties."]}, {"category": "Business & Negotiation", "q": "What happens if the parts fail quality inspection?", "a": ["We will replace any defective items in the next shipment.", "Our warranty covers defects; we will refund or replace them.", "We have a strict QC team, so failure rates are below 1%."]}, {"category": "Business & Negotiation", "q": "Is there any financial penalty for late delivery on your end?", "a": ["We can add a late delivery clause to the contract if you prefer.", "We always deliver on time, so it won't be an issue.", "If we are delayed by more than a week, we offer a 2% discount."]}, {"category": "Business & Negotiation", "q": "Could you send us a free sample if we pay for the DHL shipping?", "a": ["Yes, we can provide the sample for free if you cover the freight.", "That works for us. Please send us your courier account number.", "I'll have my team prepare the sample for dispatch today."]}, {"category": "Eating Out", "q": "Would you like to use chopsticks or should I bring a fork?", "a": ["I can use chopsticks, thank you.", "A fork would be great, I'm not very good with chopsticks.", "I'll try the chopsticks first, thanks!"]}, {"category": "Eating Out", "q": "This dish is very spicy. Is that okay with you?", "a": ["I love spicy food, so bring it on!", "Actually, could you make it mild, please?", "I prefer non-spicy food if possible."]}, {"category": "Eating Out", "q": "Could we get some extra napkins and soy sauce, please?", "a": ["Right away, I'll bring them to your table.", "Of course, just give me one moment.", "Sure, they are actually right there on the side of the table."]}, {"category": "Eating Out", "q": "Can you pack the leftovers in a takeout box?", "a": ["Yes, I will bring some containers for you.", "Of course, I'll take it to the back and pack it for you.", "Sure, do you need a plastic bag as well?"]}, {"category": "Eating Out", "q": "Do I need to leave a tip here in China?", "a": ["No, tipping is not expected or required in China.", "You don't have to; the service charge is already included.", "Actually, it's not part of the culture here, so don't worry about it."]}, {"category": "Small Talk & Networking", "q": "How do you handle the time difference between China and Bolivia?", "a": ["It's tough! It's a 12-hour difference, so I'm very jet-lagged.", "I try to sleep on the plane to adjust my body clock.", "Lots of coffee during the day helps me stay awake."]}, {"category": "Small Talk & Networking", "q": "Do you practice any sports back home in Sucre?", "a": ["Yes, I go to the gym and lift weights regularly.", "I participate in CrossFit and fitness competitions.", "I love weightlifting and doing athletic races like Hyrox."]}, {"category": "Small Talk & Networking", "q": "Have you ever visited the Great Wall or just the southern cities?", "a": ["I've only been to the south for business so far.", "I hope to visit Beijing and the Great Wall next time.", "Just Guangzhou for now, but the Great Wall is on my bucket list."]}, {"category": "Small Talk & Networking", "q": "What is the most popular motorcycle brand in Bolivia?", "a": ["Japanese brands like Honda and Yamaha are very popular.", "Chinese brands are growing rapidly due to their affordability.", "People use a mix of local assemblies and imported Asian brands."]}, {"category": "Small Talk & Networking", "q": "Can we connect on WeChat to stay in touch easier?", "a": ["Yes, definitely! Let me open my QR code for you to scan.", "That would be great. WeChat is much faster than email.", "Sure, here is my WeChat ID."]}];
        let currentIndex = 0;
        let timerInterval;

        const categoryBadge = document.getElementById('categoryBadge');
        const questionText = document.getElementById('questionText');
        const answerList = document.getElementById('answerList');
        const answersBox = document.getElementById('answersBox');
        const timerDisplay = document.getElementById('timerDisplay');
        const revealBtn = document.getElementById('revealBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const qIndexDisplay = document.getElementById('qIndexDisplay');
        const presentationArea = document.getElementById('presentationArea');

        function loadQuestion() {
            // Animation
            presentationArea.classList.remove('fade');
            void presentationArea.offsetWidth;
            presentationArea.classList.add('fade');

            const current = qaData[currentIndex];
            
            qIndexDisplay.textContent = currentIndex + 1;
            categoryBadge.textContent = current.category;
            questionText.textContent = '"' + current.q + '"';

            // Reset Answers
            answerList.innerHTML = '';
            current.a.forEach(ans => {
                const li = document.createElement('li');
                li.textContent = ans;
                answerList.appendChild(li);
            });
            answersBox.style.display = 'none';
            revealBtn.style.display = 'block';

            // Reset Timer
            clearInterval(timerInterval);
            timerDisplay.textContent = '30';
            timerDisplay.className = 'timer-circle';

            // Buttons
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === qaData.length - 1;
        }

        function revealAnswers() {
            clearInterval(timerInterval);
            answersBox.style.display = 'block';
            revealBtn.style.display = 'none';
        }

        function nextQuestion() {
            if (currentIndex < qaData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            timerDisplay.className = 'timer-circle';

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 10 && timeLeft > 5) {
                    timerDisplay.className = 'timer-circle warning';
                } else if (timeLeft <= 5 && timeLeft > 0) {
                    timerDisplay.className = 'timer-circle danger';
                } else if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "0";
                    timerDisplay.className = 'timer-circle danger';
                    // Auto reveal when time is up
                    revealAnswers();
                }
            }, 1000);
        }

        // Listen for keyboard arrows to switch questions easily during class
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === ' ' || e.key === 'Enter') revealAnswers();
        });

        // Init
        loadQuestion();
    </script>
</body>
</html>
